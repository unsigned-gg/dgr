[package]
name = "dgr"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
description = "Mathematical and machine-sympathetic directed acyclic graph (DAG) execution runtime and state engine in pure Rust"
license = "Apache-2.0 OR MIT"
authors = ["unsigned.gg <engineering@unsigned.gg>", "Christian M. Todie <chris@todie.io>"]
repository = "https://github.com/unsigned-gg/dgr"
homepage = "https://unsigned.gg"
documentation = "https://docs.rs/dgr"
readme = "README.md"
keywords = ["dag", "graph", "mathematics", "runtime", "tui"]
categories = ["data-structures", "algorithms", "command-line-utilities", "visualization"]
exclude = [".agents/", ".github/", "scripts/"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.28"
unicode-width = "0.2"
toml = "0.8"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

[[bin]]
name = "dgr"
path = "src/main.rs"

[lib]
name = "dgr"
path = "src/lib.rs"
